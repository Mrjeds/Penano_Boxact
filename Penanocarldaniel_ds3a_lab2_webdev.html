<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Mosaic</title>
<style>
*{box-sizing:border-box}body{margin:0}.mosaic{display:grid;grid-template-columns:1fr 1.5fr 1.5fr 1fr;grid-template-rows:1fr 1.5fr 1.5fr;gap:12px;padding:15px;width:100vw;height:100vh;background:#172554}.tile{min-height:0}.purple{background:#7c3aed}.teal{background:#14b8a6}.white{background:#f8fafc}.amber{background:#f59e0b}.tall-left{grid-area:1/1/3/2}.top-small{grid-area:1/2}.top-wide{grid-area:1/3}.tall-right{grid-area:1/4/3/5}.middle-wide{grid-area:2/2}.middle-right{grid-area:2/3}.bottom-left{grid-area:3/1}.bottom-wide{grid-area:3/2/4/4}.bottom-right{grid-area:3/4}
</style>
</head>
<body>
<main class="mosaic">
<div class="tile purple tall-left"></div><div class="tile teal top-small"></div><div class="tile purple top-wide"></div><div class="tile white tall-right"></div><div class="tile white middle-wide"></div><div class="tile amber middle-right"></div><div class="tile amber bottom-left"></div><div class="tile teal bottom-wide"></div><div class="tile purple bottom-right"></div>
</main>
</body>
</html>
